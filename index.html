<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 날씨 코디 추천</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* 1. 입력 화면: 파스텔톤 노란색 & 하늘색 그라데이션 */
        body.input-theme {
            background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
            color: #333;
        }

        .screen {
            width: 100%;
            max-width: 440px;
        }
        
        .hidden {
            display: none !important;
        }

        /* 카드 메인 컨테이너 */
        .card {
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .input-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #222;
            text-align: center;
            font-weight: 700;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-group {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.5);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 위치 입력 영역 */
        .location-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-location {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-location:hover {
            background: #2563eb;
        }

        .select-location {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            font-size: 0.9rem;
            outline: none;
        }

        .location-result {
            font-size: 0.85rem;
            color: #1d4ed8;
            font-weight: 600;
            margin-top: 2px;
        }

        /* 버튼 그리드 (날씨/체감, 야외 활동) */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .chip-btn {
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #475569;
            text-align: center;
        }

        .chip-btn.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        /* 경고 문구 */
        .error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
            display: none;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
            transition: transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* 2. AI 코디 결과 화면 테마 설정 */
        body.theme-bright {
            background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%);
        }

        body.theme-cloudy {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        }

        body.theme-rainy {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
        }

        .result-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            color: #0f172a;
        }

        /* 메인 헤더 영역 */
        .weather-hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-emoji {
            font-size: 3.8rem;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .hero-location {
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
        }

        .hero-temp {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
        }

        /* 추천 이미지 노출 */
        .outfit-image-container {
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background: #cbd5e1;
        }

        .outfit-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 코디 설명 카드 */
        .outfit-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .outfit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.75);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .outfit-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
        }

        .outfit-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            text-align: right;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary-reset {
            background: #0f172a;
            color: white;
        }

        .btn-secondary-reset {
            background: transparent;
            color: #475569;
            border: 1px solid #cbd5e1;
            margin-top: 8px;
        }

        /* 3. Firebase 의견 게시판 스타일 */
        .feedback-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px dashed #cbd5e1;
        }

        .feedback-header {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .feedback-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .feedback-input-group {
            display: flex;
            gap: 8px;
        }

        .feedback-input-group input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .input-nickname {
            width: 35%;
        }

        .feedback-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            resize: none;
            height: 60px;
        }

        .btn-feedback-submit {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .feedback-card-item {
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .feedback-item-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .feedback-item-name {
            font-weight: 700;
            color: #334155;
        }

        .feedback-item-content {
            font-size: 0.85rem;
            color: #1e293b;
            word-break: break-all;
        }
    </style>
</head>
<body class="input-theme">

    <!-- 1. 메인 입력 화면 -->
    <div id="inputScreen" class="screen card input-card">
        <h1>🌤️ AI 맞춤 날씨 코디</h1>

        <!-- 1) 현재 위치 선택 -->
        <div class="section-group">
            <div class="section-title">1. 현재 위치 선택 (필수)</div>
            <div class="location-box">
                <button type="button" class="btn-location" id="btnGetLocation">📍 내 위치 바로 가져오기</button>
                <select id="locationSelect" class="select-location">
                    <option value="">-- 시/도 직접 선택 --</option>
                    <option value="서울특별시">서울특별시</option>
                    <option value="경기도">경기도</option>
                    <option value="인천광역시">인천광역시</option>
                    <option value="강원특별자치도">강원특별자치도</option>
                    <option value="충청북도">충청북도</option>
                    <option value="충청남도">충청남도</option>
                    <option value="전라북도">전라북도</option>
                    <option value="전라남도">전라남도</option>
                    <option value="경상북도">경상북도</option>
                    <option value="경상남도">경상남도</option>
                    <option value="제주특별자치도">제주특별자치도</option>
                </select>
                <div id="locationResult" class="location-result"></div>
                <div id="locationError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
            </div>
        </div>

        <!-- 2) 날씨 & 체감 상태 -->
        <div class="section-group">
            <div class="section-title">2. 날씨 & 체감 상태 (다중 선택 가능)</div>
            <div class="btn-grid" id="weatherGrid">
                <button type="button" class="chip-btn" data-val="비">🌧️ 비</button>
                <button type="button" class="chip-btn" data-val="눈">❄️ 눈</button>
                <button type="button" class="chip-btn" data-val="맑음">☀️ 맑음</button>
                <button type="button" class="chip-btn" data-val="흐림">☁️ 흐림</button>
                <button type="button" class="chip-btn" data-val="습함/꿉꿉함">💧 습함/꿉꿉함</button>
                <button type="button" class="chip-btn" data-val="바람 불어 시원">🍃 바람 불어 시원</button>
                <button type="button" class="chip-btn" data-val="쌀쌀함/선선">🍂 쌀쌀함/선선</button>
                <button type="button" class="chip-btn" data-val="무더워/땡볕">🔥 무더워/땡볕</button>
            </div>
            <div id="weatherError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
        </div>

        <!-- 3) 야외 활동 목적 -->
        <div class="section-group">
            <div class="section-title">3. 야외 활동 목적</div>
            <div class="btn-grid" id="purposeGrid">
                <button type="button" class="chip-btn" data-val="산책">🐕 산책</button>
                <button type="button" class="chip-btn" data-val="러닝">🏃 러닝</button>
                <button type="button" class="chip-btn" data-val="출근/등교" style="grid-column: span 2;">🎒 출근 / 등교</button>
            </div>
            <div id="purposeError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
        </div>

        <button type="button" class="submit-btn" id="btnGenerate">✨ AI 옷차림 추천받기</button>
    </div>

    <!-- 2. AI 코디 추천 결과 화면 -->
    <div id="resultScreen" class="screen card result-card hidden">
        <div class="weather-hero">
            <div id="resEmoji" class="weather-emoji">☀️</div>
            <div id="resLocation" class="hero-location">서울</div>
            <div id="resTemp" class="hero-temp">24°C</div>
        </div>

        <!-- 이미지 추천 영역 -->
        <div class="outfit-image-container">
            <img id="outfitImg" src="" alt="AI 추천 코디 이미지">
        </div>

        <!-- 코디 세부 항목 정보 -->
        <div class="outfit-details">
            <div class="outfit-item">
                <span class="outfit-label">👕 상의</span>
                <span id="resTop" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">👖 하의</span>
                <span id="resBottom" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">🧥 겉옷</span>
                <span id="resOuter" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">🎒 추천 물품</span>
                <span id="resItems" class="outfit-value">--</span>
            </div>
        </div>

        <button type="button" class="btn-action btn-primary-reset" id="btnReGenerate">🔄 다시 코디하기 (다른 스타일)</button>
        <button type="button" class="btn-action btn-secondary-reset" id="btnGoBack">⚙️ 설정 다시 하기</button>

        <!-- Firebase 연동 사용자 의견 게시판 -->
        <div class="feedback-section">
            <div class="feedback-header">💬 사용자 코디 후기 & 의견</div>
            <div class="feedback-form">
                <input type="text" id="feedbackNickname" class="input-nickname" placeholder="닉네임" maxlength="10">
                <textarea id="feedbackText" class="feedback-textarea" placeholder="이 코디에 대한 평가나 의견을 남겨주세요!"></textarea>
                <button type="button" class="btn-feedback-submit" id="btnSubmitFeedback">의견 등록하기</button>
            </div>
            <div id="feedbackList" class="feedback-list">
                <!-- 실시간 Firebase 데이터 표출 영역 -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK 모듈 로드 및 로직 실행 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        // 전달해주신 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAmFU8CKJeETbWujvzdRM_rfJb1A3YN68Y",
            authDomain: "weather-outfit-85776.firebaseapp.com",
            projectId: "weather-outfit-85776",
            storageBucket: "weather-outfit-85776.firebasestorage.app",
            messagingSenderId: "281248174942",
            appId: "1:281248174942:web:e1c5b57d441473a7e335cf"
        };

        // Firebase 초기화 및 DB 인스턴스 생성
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedLocation = "";
        let selectedWeathers = [];
        let selectedPurpose = "";

        // UI 요소
        const btnGetLocation = document.getElementById('btnGetLocation');
        const locationSelect = document.getElementById('locationSelect');
        const btnGenerate = document.getElementById('btnGenerate');
        const btnReGenerate = document.getElementById('btnReGenerate');
        const btnGoBack = document.getElementById('btnGoBack');
        const btnSubmitFeedback = document.getElementById('btnSubmitFeedback');

        // 위치 가져오기
        btnGetLocation.addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        selectedLocation = "현재 위치 (서울특별시 마포구)";
                        document.getElementById('locationResult').innerText = "✅ " + selectedLocation;
                        locationSelect.value = "";
                        hideError('locationError');
                    },
                    (err) => {
                        alert("위치 접근 허용이 필요합니다. 아래 드롭다운에서 지역을 선택해 주세요.");
                    }
                );
            }
        });

        locationSelect.addEventListener('change', () => {
            const val = locationSelect.value;
            if(val) {
                selectedLocation = val;
                document.getElementById('locationResult').innerText = "✅ " + selectedLocation;
                hideError('locationError');
            }
        });

        // 날씨 다중 선택
        document.querySelectorAll('#weatherGrid .chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!selectedLocation) {
                    showError('locationError');
                    return;
                }
                
                btn.classList.toggle('selected');
                const val = btn.getAttribute('data-val');
                
                if (btn.classList.contains('selected')) {
                    selectedWeathers.push(val);
                } else {
                    selectedWeathers = selectedWeathers.filter(item => item !== val);
                }

                if (selectedWeathers.length > 0) {
                    hideError('weatherError');
                }
            });
        });

        // 야외 활동 선택
        document.querySelectorAll('#purposeGrid .chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!selectedLocation) {
                    showError('locationError');
                    return;
                }
                if (selectedWeathers.length === 0) {
                    showError('weatherError');
                    return;
                }

                document.querySelectorAll('#purposeGrid .chip-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedPurpose = btn.getAttribute('data-val');
                hideError('purposeError');
            });
        });

        function showError(id) {
            document.getElementById(id).style.display = 'block';
        }

        function hideError(id) {
            document.getElementById(id).style.display = 'none';
        }

        // 결과 생성
        btnGenerate.addEventListener('click', generateOutfit);
        btnReGenerate.addEventListener('click', generateOutfit);

        btnGoBack.addEventListener('click', () => {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('inputScreen').classList.remove('hidden');
            document.body.className = "input-theme";
        });

        function generateOutfit() {
            if (!selectedLocation) { showError('locationError'); return; }
            if (selectedWeathers.length === 0) { showError('weatherError'); return; }
            if (!selectedPurpose) { showError('purposeError'); return; }

            const isRainy = selectedWeathers.includes('비');
            const isCloudy = selectedWeathers.includes('흐림');
            const isSnow = selectedWeathers.includes('눈');
            const isHot = selectedWeathers.includes('무더워/땡볕');
            const isCold = selectedWeathers.includes('쌀쌀함/선선');

            document.body.className = "";
            let bgTheme = "theme-bright"; 
            let emoji = "☀️";
            let defaultTemp = "25°C";

            if (isRainy) { bgTheme = "theme-rainy"; emoji = "🌧️"; defaultTemp = "18°C"; }
            else if (isCloudy) { bgTheme = "theme-cloudy"; emoji = "☁️"; defaultTemp = "20°C"; }
            else if (isSnow) { bgTheme = "theme-cloudy"; emoji = "❄️"; defaultTemp = "-1°C"; }
            else if (isHot) { bgTheme = "theme-bright"; emoji = "☀️"; defaultTemp = "30°C"; }
            else if (isCold) { bgTheme = "theme-bright"; emoji = "🍂"; defaultTemp = "15°C"; }

            document.body.classList.add(bgTheme);

            document.getElementById('resEmoji').innerText = emoji;
            document.getElementById('resLocation').innerText = selectedLocation;
            document.getElementById('resTemp').innerText = defaultTemp;

            const randomSeed = Math.floor(Math.random() * 10000);
            document.getElementById('outfitImg').src = `https://picsum.photos/600/800?random=${randomSeed}`;

            const outfitsData = {
                top: ["오버핏 린넨 반팔 셔츠", "캐주얼 단가라 피케 셔츠", "기능성 크루넥 티셔츠", "소프트 오버사이즈 니트", "베이직 맨투맨"],
                bottom: ["와이드 데님 팬츠", "쿨링 버뮤다 쇼츠", "테이퍼드 슬랙스", "스트릿 조거 팬츠", "코튼 카고 팬츠"],
                outer: ["경량 윈드브레이커", "오버핏 베이지 카디건", "클래식 데님 자켓", "지퍼 홑겹 점퍼", "선택 안함 (단품 추천)"],
                items: ["양산 & UV 차단 선글라스", "접이식 휴대용 우산", "기능성 슬링백 & 텀블러", "볼캡 모자", "미니 크로스백"]
            };

            const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

            document.getElementById('resTop').innerText = getRandomItem(outfitsData.top);
            document.getElementById('resBottom').innerText = getRandomItem(outfitsData.bottom);
            document.getElementById('resOuter').innerText = isHot ? "선택 안함 (단품 추천)" : getRandomItem(outfitsData.outer);
            document.getElementById('resItems').innerText = isRainy ? "보호용 장우산 & 방수 백 Cover" : getRandomItem(outfitsData.items);

            document.getElementById('inputScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        // ==========================================
        // Firebase Firestore 의견 게시판 기능
        // ==========================================

        // 1) 의견 등록
        btnSubmitFeedback.addEventListener('click', async () => {
            const nicknameInput = document.getElementById('feedbackNickname');
            const textInput = document.getElementById('feedbackText');

            const nickname = nicknameInput.value.trim() || "익명";
            const content = textInput.value.trim();

            if (!content) {
                alert("의견 내용을 입력해주세요.");
                return;
            }

            try {
                // 'feedbacks' 컬렉션에 데이터 추가
                await addDoc(collection(db, "feedbacks"), {
                    nickname: nickname,
                    content: content,
                    createdAt: serverTimestamp()
                });

                textInput.value = "";
            } catch (error) {
                console.error("의견 등록 실패:", error);
                alert("의견을 등록하는 중 오류가 발생했습니다.");
            }
        });

        // 2) 실시간 의견 목록 불러오기 (onSnapshot 사용)
        const q = query(collection(db, "feedbacks"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            const feedbackListEl = document.getElementById('feedbackList');
            feedbackListEl.innerHTML = ""; // 기존 리스트 초기화

            if (snapshot.empty) {
                feedbackListEl.innerHTML = `<div style="text-align:center; font-size:0.8rem; color:#64748b; padding:10px;">첫 번째 코디 의견을 남겨보세요!</div>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                
                // 날짜 포맷 변환
                let dateStr = "방금 전";
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = 'feedback-card-item';
                itemDiv.innerHTML = `
                    <div class="feedback-item-top">
                        <span class="feedback-item-name">${escapeHtml(data.nickname)}</span>
                        <span>${dateStr}</span>
                    </div>
                    <div class="feedback-item-content">${escapeHtml(data.content)}</div>
                `;
                feedbackListEl.appendChild(itemDiv);
            });
        });

        // HTML 인젝션 방지
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
