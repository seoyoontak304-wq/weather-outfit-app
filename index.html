<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sky Weather - Dark Mode Theme</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 배경: 깊은 밤하늘 느낌의 다크 그라데이션 */
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            color: #ffffff;
            padding: 20px;
        }

        /* 메인 컨테이너 (Glassmorphism 적용) */
        .weather-card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* 헤더 영역 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .location {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .date {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        /* 메인 날씨 정보 */
        .weather-main {
            text-align: center;
            margin: 20px 0 32px 0;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .temp-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .temperature {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
        }

        .unit {
            font-size: 1.5rem;
            font-weight: 400;
            margin-top: 6px;
            margin-left: 2px;
            color: rgba(255, 255, 255, 0.8);
        }

        .condition {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 8px;
            font-weight: 500;
        }

        /* 세부 날씨 정보 그리드 */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .detail-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* 시간별 예보 영역 */
        .hourly-forecast {
            margin-top: 24px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hourly-list {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .hourly-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 10px;
            border-radius: 12px;
            min-width: 58px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hourly-time {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .hourly-temp {
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 8px;
        }

        /* SVG 아이콘 간단 스타일 */
        .icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <!-- 상단 지역 및 날짜 정보 -->
        <div class="card-header">
            <div>
                <div class="location">서울, 대한민국</div>
                <div class="date">7월 28일 화요일</div>
            </div>
            <!-- 위치 아이콘 -->
            <svg class="icon" viewBox="0 0 24 24" style="color: rgba(255, 255, 255, 0.8);">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>

        <!-- 메인 날씨 정보 -->
        <div class="weather-main">
            <div class="weather-icon">
                <!-- 날씨 아이콘 (달 + 구름 예시) -->
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#e0e1dd" stroke-width="1.5">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#f4a261" stroke="none"/>
                    <path d="M17.5 19H9a5 5 0 0 1 0-10 6 6 0 0 1 11.5 2.5A3.5 3.5 0 0 1 17.5 19z" fill="#415a77" opacity="0.9"/>
                </svg>
            </div>
            <div class="temp-container">
                <span class="temperature">24</span>
                <span class="unit">°C</span>
            </div>
            <div class="condition">대체로 흐림</div>
        </div>

        <!-- 세부 지표 그리드 -->
        <div class="details-grid">
            <div class="detail-item">
                <span class="detail-label">습도</span>
                <span class="detail-value">68%</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">풍속</span>
                <span class="detail-value">3.2 m/s</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">체감</span>
                <span class="detail-value">25°C</span>
            </div>
        </div>

        <!-- 시간별 날씨 예보 -->
        <div class="hourly-forecast">
            <div class="section-title">시간별 예보</div>
            <div class="hourly-list">
                <div class="hourly-item">
                    <span class="hourly-time">지금</span>
                    <svg class="icon" viewBox="0 0 24 24" stroke="#f4a261"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
                    <span class="hourly-temp">24°</span>
                </div>
                <div class="hourly-item">
                    <span class="hourly-time">14시</span>
                    <svg class="icon" viewBox="0 0 24 24" stroke="#e0e1dd"><path d="M17.5 19H9a5 5 0 0 1 0-10 6 6 0 0 1 11.5 2.5A3.5 3.5 0 0 1 17.5 19z"/></svg>
                    <span class="hourly-temp">25°</span>
                </div>
                <div class="hourly-item">
                    <span class="hourly-time">15시</span>
                    <svg class="icon" viewBox="0 0 24 24" stroke="#e0e1dd"><path d="M17.5 19H9a5 5 0 0 1 0-10 6 6 0 0 1 11.5 2.5A3.5 3.5 0 0 1 17.5 19z"/></svg>
                    <span class="hourly-temp">25°</span>
                </div>
                <div class="hourly-item">
                    <span class="hourly-time">16시</span>
                    <svg class="icon" viewBox="0 0 24 24" stroke="#48cae4"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="8" y1="16" x2="8" y2="20"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
                    <span class="hourly-temp">22°</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
