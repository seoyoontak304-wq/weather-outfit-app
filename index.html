<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 날씨 코디 추천</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* 1. 입력 화면: 파스텔톤 노란색 & 하늘색 그라데이션 */
        body.input-theme {
            background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
            color: #333;
        }

        .screen {
            width: 100%;
            max-width: 440px;
        }
        .hidden {
            display: none !important;
        }

        /* 카드 공통 */
        .card {
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .input-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #222;
            text-align: center;
            font-weight: 700;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-group {
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.5);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 위치 입력 영역 */
        .location-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-location {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-location:hover { background: #357abd; }

        .select-location {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            font-size: 0.9rem;
            outline: none;
        }

        .location-result {
            font-size: 0.85rem;
            color: #2b6cb0;
            font-weight: 600;
            margin-top: 4px;
        }

        /* 버튼 그룹 (날씨/체감, 야외 활동) */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .chip-btn {
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #4a5568;
            text-align: center;
        }

        .chip-btn.selected {
            background: #3182ce;
            color: white;
            border-color: #3182ce;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(49, 130, 206, 0.3);
        }

        /* 경고 메시지 */
        .error-msg {
            color: #e53e3e;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 6px;
            display: none;
        }

        /* AI 추천 받기 버튼 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* 2. AI 코디 결과 화면 */
        /* 동적 테마 배경색 처리 */
        body.theme-bright {
            background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%);
        }
        body.theme-cloudy {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
        }
        body.theme-rainy {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
        }

        .result-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #1e293b;
        }

        /* 상단 날씨 정보 영역 */
        .weather-hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-emoji {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .hero-location {
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
        }

        .hero-temp {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
        }

        /* 코디 추천 사진 영역 */
        .outfit-image-container {
            width: 100%;
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background: #e2e8f0;
        }

        .outfit-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 코디 상세 설명 카드 */
        .outfit-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .outfit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.7);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .outfit-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
        }

        .outfit-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            text-align: right;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-btn:hover { background: #1e293b; }
    </style>
</head>
<body class="input-theme">

    <!-- 1. 입력 화면 -->
    <div id="inputScreen" class="screen card input-card">
        <h1>🌤️ AI 맞춤 날씨 코디</h1>

        <!-- 1. 위치 선택 -->
        <div class="section-group">
            <div class="section-title">1. 현재 위치 선택 (필수)</div>
            <div class="location-box">
                <button type="button" class="btn-location" onclick="getLocation()">📍 내 위치 바로 가져오기</button>
                <select id="locationSelect" class="select-location" onchange="onSelectLocation()">
                    <option value="">-- 시/도 직접 선택 --</option>
                    <option value="서울특별시">서울특별시</option>
                    <option value="경기도">경기도</option>
                    <option value="인천광역시">인천광역시</option>
                    <option value="강원특별자치도">강원특별자치도</option>
                    <option value="충청북도">충청북도</option>
                    <option value="충청남도">충청남도</option>
                    <option value="전라북도">전라북도</option>
                    <option value="전라남도">전라남도</option>
                    <option value="경상북도">경상북도</option>
                    <option value="경상남도">경상남도</option>
                    <option value="제주특별자치도">제주특별자치도</option>
                </select>
                <div id="locationResult" class="location-result"></div>
                <div id="locationError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
            </div>
        </div>

        <!-- 2. 날씨 & 체감 상태 (중복 선택) -->
        <div class="section-group">
            <div class="section-title">2. 날씨 & 체감 상태 (다중 선택 가능)</div>
            <div class="btn-grid" id="weatherGrid">
                <button type="button" class="chip-btn" data-val="비">🌧️ 비</button>
                <button type="button" class="chip-btn" data-val="눈">❄️ 눈</button>
                <button type="button" class="chip-btn" data-val="맑음">☀️ 맑음</button>
                <button type="button" class="chip-btn" data-val="흐림">☁️ 흐림</button>
                <button type="button" class="chip-btn" data-val="습함/꿉꿉함">💧 습함/꿉꿉함</button>
                <button type="button" class="chip-btn" data-val="바람 불어 시원">🍃 바람 불어 시원</button>
                <button type="button" class="chip-btn" data-val="쌀쌀함/선선">🍂 쌀쌀함/선선</button>
                <button type="button" class="chip-btn" data-val="무더워/땡볕">🔥 무더워/땡볕</button>
            </div>
            <div id="weatherError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
        </div>

        <!-- 3. 야외 활동 목적 (단일 선택) -->
        <div class="section-group">
            <div class="section-title">3. 야외 활동 목적</div>
            <div class="btn-grid" id="purposeGrid">
                <button type="button" class="chip-btn" data-val="산책">🐕 산책</button>
                <button type="button" class="chip-btn" data-val="러닝">🏃 러닝</button>
                <button type="button" class="chip-btn" data-val="출근/등교" style="grid-column: span 2;">🎒 출근 / 등교</button>
            </div>
            <div id="purposeError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
        </div>

        <button type="button" class="submit-btn" onclick="generateOutfit()">✨ AI 옷차림 추천받기</button>
    </div>

    <!-- 2. 결과 화면 -->
    <div id="resultScreen" class="screen card result-card hidden">
        <div class="weather-hero">
            <div id="resEmoji" class="weather-emoji">☀️</div>
            <div id="resLocation" class="hero-location">서울</div>
            <div id="resTemp" class="hero-temp">24°C</div>
        </div>

        <!-- 다양한 코디 이미지 -->
        <div class="outfit-image-container">
            <img id="outfitImg" src="" alt="추천 코디 이미지">
        </div>

        <!-- 코디 상세 설명 -->
        <div class="outfit-details">
            <div class="outfit-item">
                <span class="outfit-label">👕 상의</span>
                <span id="resTop" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">👖 하의</span>
                <span id="resBottom" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">🧥 겉옷</span>
                <span id="resOuter" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">🎒 추천 물품</span>
                <span id="resItems" class="outfit-value">--</span>
            </div>
        </div>

        <button type="button" class="reset-btn" onclick="generateOutfit()">🔄 다른 코디 다시 추천받기</button>
        <button type="button" class="reset-btn" style="background: transparent; color: #64748b; margin-top: 8px; border: 1px solid #cbd5e1;" onclick="goBack()">⚙️ 설정 다시 하기</button>
    </div>

    <script>
        let selectedLocation = "";
        let selectedWeathers = [];
        let selectedPurpose = "";

        // 1. 위치 관련 처리
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        // 위치 가져오기 성공 샘플 (실제 서비스시 역지오코딩 적용)
                        selectedLocation = "현재 위치 (서울특별시 마포구)";
                        document.getElementById('locationResult').innerText = "✅ " + selectedLocation;
                        document.getElementById('locationSelect').value = "";
                        hideError('locationError');
                    },
                    (err) => {
                        alert("위치 정보를 가져올 수 없습니다. 직접 지역을 선택해 주세요.");
                    }
                );
            }
        }

        function onSelectLocation() {
            const val = document.getElementById('locationSelect').value;
            if(val) {
                selectedLocation = val;
                document.getElementById('locationResult').innerText = "✅ " + selectedLocation;
                hideError('locationError');
            }
        }

        // 2. 날씨 & 체감 버튼 (중복 선택)
        document.querySelectorAll('#weatherGrid .chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 순서 검증: 위치 미선택 시 경고
                if (!selectedLocation) {
                    showError('locationError');
                    return;
                }
                
                btn.classList.toggle('selected');
                const val = btn.getAttribute('data-val');
                
                if (btn.classList.contains('selected')) {
                    selectedWeathers.push(val);
                } else {
                    selectedWeathers = selectedWeathers.filter(item => item !== val);
                }

                if (selectedWeathers.length > 0) {
                    hideError('weatherError');
                }
            });
        });

        // 3. 야외 활동 목적 버튼 (단일 선택)
        document.querySelectorAll('#purposeGrid .chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 순서 검증: 이전 필수 항목 체크
                if (!selectedLocation) {
                    showError('locationError');
                    return;
                }
                if (selectedWeathers.length === 0) {
                    showError('weatherError');
                    return;
                }

                document.querySelectorAll('#purposeGrid .chip-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedPurpose = btn.getAttribute('data-val');
                hideError('purposeError');
            });
        });

        function showError(id) {
            document.getElementById(id).style.display = 'block';
        }

        function hideError(id) {
            document.getElementById(id).style.display = 'none';
        }

        // 4. 결과 생성 및 화면 전환
        function generateOutfit() {
            // 순서 및 필수 항목 최종 검증
            if (!selectedLocation) {
                showError('locationError');
                return;
            }
            if (selectedWeathers.length === 0) {
                showError('weatherError');
                return;
            }
            if (!selectedPurpose) {
                showError('purposeError');
                return;
            }

            // --- 날씨 조건에 맞춘 디자인 & 이모지 변환 ---
            const isRainy = selectedWeathers.includes('비');
            const isCloudy = selectedWeathers.includes('흐림');
            const isSnow = selectedWeathers.includes('눈');
            const isHot = selectedWeathers.includes('무더워/땡볕');
            const isCold = selectedWeathers.includes('쌀쌀함/선선');

            // 배경 설정: 비/흐림이 아닌 경우 밝은 색상 선호
            document.body.className = ""; // 이전 클래스 제거
            let bgTheme = "theme-bright"; 
            let emoji = "☀️";
            let defaultTemp = "24°C";

            if (isRainy) {
                bgTheme = "theme-rainy";
                emoji = "🌧️";
                defaultTemp = "19°C";
            } else if (isCloudy) {
                bgTheme = "theme-cloudy";
                emoji = "☁️";
                defaultTemp = "21°C";
            } else if (isSnow) {
                bgTheme = "theme-cloudy";
                emoji = "❄️";
                defaultTemp = "-2°C";
            } else if (isHot) {
                bgTheme = "theme-bright";
                emoji = "☀️";
                defaultTemp = "31°C";
            } else if (isCold) {
                bgTheme = "theme-bright";
                emoji = "🍂";
                defaultTemp = "14°C";
            }

            document.body.classList.add(bgTheme);

            // 데이터 반영
            document.getElementById('resEmoji').innerText = emoji;
            document.getElementById('resLocation').innerText = selectedLocation;
            document.getElementById('resTemp').innerText = defaultTemp;

            // --- 랜덤 코디 사진 및 추천 데이터 세팅 ---
            // 캐시 방지를 위해 시각(timestamp) 및 랜덤 파라미터 부여
            const randomId = Math.floor(Math.random() * 1000);
            
            // 활동/날씨 키워드로 Unsplash 이미지 무작위 추출
            let imgKeyword = isHot ? 'summer-fashion' : (isCold || isSnow ? 'winter-fashion' : 'casual-fashion');
            if (selectedPurpose === '러닝') imgKeyword = 'running-wear';
            
            document.getElementById('outfitImg').src = `https://source.unsplash.com/featured/600x800/?${imgKeyword}&sig=${randomId}`;

            // 다채로운 랜덤 추천 데이터베이스
            const outfitsData = {
                top: ["오버핏 린넨 반팔", "기능성 코튼 티셔츠", "캐주얼 단가라 스트라이프", "스페셜 와플 맨투맨", "베이직 라운드 니트"],
                bottom: ["편안한 밴딩 슬랙스", "데님 파티그 팬츠", "스트릿 조거 팬츠", "쿨링 버뮤다 쇼츠", "코튼 카고 팬츠"],
                outer: ["경량 윈드브레이커", "오버핏 카디건", "트렌디 데님 자켓", "지퍼 홑겹 점퍼", "선택 안함 (단품)"],
                items: ["양산 & UV 차단 선글라스", "보호용 장우산", "기능성 슬링백 & 텀블러", "가벼운 캡모자", "방수 미니 백"]
            };

            const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

            document.getElementById('resTop').innerText = getRandom(outfitsData.top);
            document.getElementById('resBottom').innerText = getRandom(outfitsData.bottom);
            document.getElementById('resOuter').innerText = isHot ? "선택 안함 (단품 추천)" : getRandom(outfitsData.outer);
            document.getElementById('resItems').innerText = isRainy ? "보호용 장우산 & 방수백" : getRandom(outfitsData.items);

            // 화면 전환
            document.getElementById('inputScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('inputScreen').classList.remove('hidden');
            document.body.className = "input-theme";
        }
    </script>
</body>
</html>
