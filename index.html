<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 날씨 맞춤 옷차림 추천</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 1. 첫 화면: 파스텔톤 노란색 ~ 하늘색 그라데이션 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
            padding: 20px;
            transition: background 0.6s ease;
        }

        .screen {
            width: 100%;
            max-width: 440px;
        }

        .hidden {
            display: none !important;
        }

        /* 메인 카드 스타일 */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2b2d42;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 24px;
            text-align: center;
        }

        /* 섹션 공통 */
        .section {
            margin-bottom: 22px;
        }

        .section-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .required-badge {
            color: #e63946;
            font-size: 0.8rem;
        }

        /* 위치 선택 요소 */
        .location-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .location-btn:hover {
            background-color: #357abd;
        }

        .select-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            background-color: #fff;
            color: #333;
        }

        /* 경고 메세지 */
        .alert-msg {
            color: #d90429;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 6px;
            display: none;
        }

        /* 버튼 태그 선택 스타일 */
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 9px 14px;
            background-color: #f1f3f5;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #495057;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .chip.selected {
            background-color: #333;
            color: #fff;
            border-color: #333;
            font-weight: 600;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            color: #4a4a4a;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* 2. 결과 화면 스타일 */
        .result-card {
            text-align: center;
            color: #fff;
            padding: 30px 24px;
        }

        /* 동적 테마 배경색 클래스들 */
        body.theme-clear { background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%); }
        body.theme-rain { background: linear-gradient(135deg, #4a6fa5 0%, #166088 100%); }
        body.theme-snow { background: linear-gradient(135deg, #a8ded1 0%, #379634 100%); }
        body.theme-cloud { background: linear-gradient(135deg, #757bc8 0%, #8e94f2 100%); }
        body.theme-hot { background: linear-gradient(135deg, #f72585 0%, #7209b7 100%); }
        body.theme-default { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); }

        .weather-hero {
            margin-bottom: 24px;
        }

        .weather-emoji {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 10px;
        }

        .result-location {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .result-temp {
            font-size: 3rem;
            font-weight: 800;
            margin: 4px 0;
        }

        /* 코디 추천 가이드 영역 */
        .outfit-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: left;
        }

        .outfit-img-box {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
            font-size: 3.5rem;
        }

        .outfit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .outfit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .outfit-label {
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.8;
        }

        .outfit-desc {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            border-radius: 12px;
            margin-top: 18px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- 1. 입력 화면 (파스텔 그라데이션) -->
    <div id="inputScreen" class="screen card">
        <h1 class="title">AI 날씨 코디 추천</h1>
        <p class="subtitle">오늘의 날씨와 목적에 맞는 최적의 옷차림을 받아보세요.</p>

        <!-- 1단계: 위치 선택 (필수) -->
        <div class="section">
            <div class="section-label">
                1. 현재 위치 & 날씨 체감 선택 <span class="required-badge">*필수</span>
            </div>
            <button class="location-btn" type="button" onclick="getLocation()">📍 내 위치 정보 가져오기</button>
            <select id="regionSelect" class="select-box" onchange="checkLocationSelected()">
                <option value="">시/도 직접 선택</option>
                <option value="서울특별시">서울특별시</option>
                <option value="경기도">경기도</option>
                <option value="인천광역시">인천광역시</option>
                <option value="강원도">강원도</option>
                <option value="충청북도">충청북도</option>
                <option value="충청남도">충청남도</option>
                <option value="전라북도">전라북도</option>
                <option value="전라남도">전라남도</option>
                <option value="경상북도">경상북도</option>
                <option value="경상남도">경상남도</option>
                <option value="제주특별자치도">제주특별자치도</option>
            </select>
            <div id="locationAlert" class="alert-msg">⚠️ 필수항목을 먼저 선택해 주세요.</div>
        </div>

        <!-- 2단계: 날씨 & 체감 상태 (중복 선택 가능) -->
        <div class="section" onclick="validateStepAccess(event)">
            <div class="section-label">2. 날씨 & 체감 상태 (중복 가능)</div>
            <div class="chip-group" id="weatherChips">
                <div class="chip" onclick="toggleChip(this)">비 🌧️</div>
                <div class="chip" onclick="toggleChip(this)">눈 ❄️</div>
                <div class="chip" onclick="toggleChip(this)">맑음 ☀️</div>
                <div class="chip" onclick="toggleChip(this)">흐림 ☁️</div>
                <div class="chip" onclick="toggleChip(this)">습함/꿉꿉함 💧</div>
                <div class="chip" onclick="toggleChip(this)">바람 불어 시원 🍃</div>
                <div class="chip" onclick="toggleChip(this)">쌀쌀함/선선 🍂</div>
                <div class="chip" onclick="toggleChip(this)">무더워/땡볕 🥵</div>
            </div>
        </div>

        <!-- 3단계: 야외 활동 목적 -->
        <div class="section" onclick="validateStepAccess(event)">
            <div class="section-label">3. 야외 활동 목적</div>
            <div class="chip-group" id="purposeChips">
                <div class="chip" onclick="selectSingleChip(this)">산책 🚶</div>
                <div class="chip" onclick="selectSingleChip(this)">러닝 🏃</div>
                <div class="chip" onclick="selectSingleChip(this)">출근/등교 💼</div>
            </div>
        </div>

        <button type="button" class="submit-btn" onclick="generateOutfit()">AI 옷차림 추천받기 ✨</button>
    </div>

    <!-- 2. 결과 화면 (날씨 맞춤 디자인 반영) -->
    <div id="resultScreen" class="screen card result-card hidden">
        <div class="weather-hero">
            <div id="resEmoji" class="weather-emoji">☀️</div>
            <div id="resLocation" class="result-location">서울특별시</div>
            <div id="resTemp" class="result-temp">24°C</div>
        </div>

        <div class="outfit-container">
            <!-- 코디 이미지 / 일러스트 예시 박스 -->
            <div class="outfit-img-box" id="outfitIllustration">
                👔👖
            </div>

            <div class="outfit-list">
                <div class="outfit-item">
                    <span class="outfit-label">👕 상의</span>
                    <span class="outfit-desc" id="resTop">반팔 티셔츠 / 린넨 셔츠</span>
                </div>
                <div class="outfit-item">
                    <span class="outfit-label">👖 하의</span>
                    <span class="outfit-desc" id="resBottom">면바지 / 슬랙스</span>
                </div>
                <div class="outfit-item">
                    <span class="outfit-label">🧥 겉옷</span>
                    <span class="outfit-desc" id="resOuter">얇은 가디건</span>
                </div>
                <div class="outfit-item">
                    <span class="outfit-label">🎒 추천 물품</span>
                    <span class="outfit-desc" id="resItem">양산 / 자외선 차단제</span>
                </div>
            </div>
        </div>

        <button type="button" class="reset-btn" onclick="resetPage()">다시 설정하기</button>
    </div>

    <script>
        let selectedLocation = "";

        // 위치 가져오기 (GPS 버튼)
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        selectedLocation = "현재 위치 (GPS 확인됨)";
                        document.getElementById('regionSelect').value = "";
                        hideAlert();
                        alert("현재 위치 정보를 성공적으로 가져왔습니다.");
                    },
                    (error) => {
                        alert("위치 정보를 가져올 수 없습니다. 목록에서 직접 선택해 주세요.");
                    }
                );
            } else {
                alert("이 브라우저에서는 Geolocation을 지원하지 않습니다.");
            }
        }

        // 셀렉트 박스 변경 시
        function checkLocationSelected() {
            const select = document.getElementById('regionSelect');
            selectedLocation = select.value;
            if (selectedLocation) {
                hideAlert();
            }
        }

        // 필수 항목 미선택 시 경고 노출
        function validateStepAccess(e) {
            if (!selectedLocation) {
                showAlert();
            }
        }

        function showAlert() {
            document.getElementById('locationAlert').style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('locationAlert').style.display = 'none';
        }

        // 다중 선택 칩 (날씨 상태)
        function toggleChip(element) {
            if (!selectedLocation) {
                showAlert();
                return;
            }
            element.classList.toggle('selected');
        }

        // 단일 선택 칩 (활동 목적)
        function selectSingleChip(element) {
            if (!selectedLocation) {
                showAlert();
                return;
            }
            const parent = element.parentElement;
            parent.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        // 추천 결과 생성 및 화면 전환
        function generateOutfit() {
            if (!selectedLocation) {
                showAlert();
                return;
            }

            // 선택된 날씨 값 추출
            const selectedWeathers = Array.from(document.querySelectorAll('#weatherChips .chip.selected')).map(c => c.innerText);
            
            // UI 테마 및 메인 이모지 결정
            let themeClass = "theme-default";
            let emoji = "🌤️";
            let tempStr = "22°C";
            let top = "기본 반팔 티셔츠";
            let bottom = "데님 팬츠 / 슬랙스";
            let outer = "없음";
            let item = "보조 배터리";
            let outfitGraphic = "👕👖";

            const weatherStr = selectedWeathers.join(" ");

            if (weatherStr.includes("비")) {
                themeClass = "theme-rain";
                emoji = "🌧️";
                item = "접이식 우산 / 방수 신발";
                outfitGraphic = "🧥☔";
            } else if (weatherStr.includes("눈")) {
                themeClass = "theme-snow";
                emoji = "❄️";
                tempStr = "-2°C";
                outer = "패딩 / 패딩 조끼";
                item = "장갑 / 핫팩";
                outfitGraphic = "🧥🧣";
            } else if (weatherStr.includes("무더워") || weatherStr.includes("땡볕")) {
                themeClass = "theme-hot";
                emoji = "☀️";
                tempStr = "31°C";
                top = "민소매 / 얇은 린넨 반팔";
                bottom = "반바지 / 통풍 팬츠";
                item = "선글라스 / 양산";
                outfitGraphic = "🎽🩳";
            } else if (weatherStr.includes("맑음")) {
                themeClass = "theme-clear";
                emoji = "☀️";
                tempStr = "25°C";
            } else if (weatherStr.includes("흐림")) {
                themeClass = "theme-cloud";
                emoji = "☁️";
            }

            // 결과 데이터 반영
            document.getElementById('resEmoji').innerText = emoji;
            document.getElementById('resLocation').innerText = selectedLocation;
            document.getElementById('resTemp').innerText = tempStr;
            document.getElementById('resTop').innerText = top;
            document.getElementById('resBottom').innerText = bottom;
            document.getElementById('resOuter').innerText = outer;
            document.getElementById('resItem').innerText = item;
            document.getElementById('outfitIllustration').innerText = outfitGraphic;

            // 화면 전환 및 배경 스타일 변경
            document.body.className = themeClass;
            document.getElementById('inputScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        // 다시 설정하기 (처음 화면으로 복구)
        function resetPage() {
            document.body.className = "";
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('inputScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
