<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 날씨 코디 추천 & 피드백</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* 1. 입력 화면: 파스텔톤 노란색 & 하늘색 그라데이션 */
        body.input-theme {
            background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
            color: #333;
        }

        .screen {
            width: 100%;
            max-width: 460px;
        }
        
        .hidden {
            display: none !important;
        }

        .card {
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .input-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #222;
            text-align: center;
            font-weight: 700;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-group {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.5);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 위치 입력 영역 */
        .location-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-location {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-location:hover { background: #2563eb; }

        .select-location {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            font-size: 0.9rem;
            outline: none;
        }

        .location-result {
            font-size: 0.85rem;
            color: #1d4ed8;
            font-weight: 600;
            margin-top: 2px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .chip-btn {
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #475569;
            text-align: center;
        }

        .chip-btn.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
            transition: transform 0.1s;
        }

        .submit-btn:active { transform: scale(0.98); }

        /* 결과 화면 배경 테마 */
        body.theme-bright { background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%); }
        body.theme-cloudy { background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); }
        body.theme-rainy { background: linear-gradient(135deg, #475569 0%, #334155 100%); }

        .result-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            color: #0f172a;
        }

        .weather-hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-emoji {
            font-size: 3.8rem;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .hero-location {
            font-size: 1.1rem;
            font-weight: 700;
            color: #334155;
        }

        .hero-temp {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
        }

        .outfit-image-container {
            width: 100%;
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background: #cbd5e1;
        }

        .outfit-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .outfit-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .outfit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.75);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .outfit-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
        }

        .outfit-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            text-align: right;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary-reset { background: #0f172a; color: white; }
        .btn-secondary-reset { background: transparent; color: #475569; border: 1px solid #cbd5e1; margin-top: 8px; }

        /* 게시판 스타일 (Firebase) */
        .board-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 2px stroke #e2e8f0;
        }

        .board-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .board-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .board-input, .board-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .board-textarea {
            resize: none;
            height: 60px;
        }

        .board-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .board-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .board-item {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .board-item-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .board-item-name { font-weight: 700; color: #334155; }
        .board-item-content { font-size: 0.85rem; color: #1e293b; }
    </style>
</head>
<body class="input-theme">

    <!-- 1. 메인 입력 화면 -->
    <div id="inputScreen" class="screen card input-card">
        <h1>🌤️ AI 맞춤 날씨 코디</h1>

        <!-- 위치 선택 -->
        <div class="section-group">
            <div class="section-title">1. 현재 위치 선택 (필수)</div>
            <div class="location-box">
                <button type="button" class="btn-location" onclick="getLocation()">📍 내 위치 바로 가져오기</button>
                <select id="locationSelect" class="select-location" onchange="onSelectLocation()">
                    <option value="">-- 시/도 직접 선택 --</option>
                    <option value="서울특별시">서울특별시</option>
                    <option value="경기도">경기도</option>
                    <option value="인천광역시">인천광역시</option>
                    <option value="강원특별자치도">강원특별자치도</option>
                    <option value="충청북도">충청북도</option>
                    <option value="충청남도">충청남도</option>
                    <option value="전라북도">전라북도</option>
                    <option value="전라남도">전라남도</option>
                    <option value="경상북도">경상북도</option>
                    <option value="경상남도">경상남도</option>
                    <option value="제주특별자치도">제주특별자치도</option>
                </select>
                <div id="locationResult" class="location-result"></div>
                <div id="locationError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
            </div>
        </div>

        <!-- 날씨 & 체감 상태 -->
        <div class="section-group">
            <div class="section-title">2. 날씨 & 체감 상태 (다중 선택 가능)</div>
            <div class="btn-grid" id="weatherGrid">
                <button type="button" class="chip-btn" data-val="비">🌧️ 비</button>
                <button type="button" class="chip-btn" data-val="눈">❄️ 눈</button>
                <button type="button" class="chip-btn" data-val="맑음">☀️ 맑음</button>
                <button type="button" class="chip-btn" data-val="흐림">☁️ 흐림</button>
                <button type="button" class="chip-btn" data-val="습함/꿉꿉함">💧 습함/꿉꿉함</button>
                <button type="button" class="chip-btn" data-val="바람 불어 시원">🍃 바람 불어 시원</button>
                <button type="button" class="chip-btn" data-val="쌀쌀함/선선">🍂 쌀쌀함/선선</button>
                <button type="button" class="chip-btn" data-val="무더워/땡볕">🔥 무더워/땡볕</button>
            </div>
            <div id="weatherError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
        </div>

        <!-- 야외 활동 목적 -->
        <div class="section-group">
            <div class="section-title">3. 야외 활동 목적</div>
            <div class="btn-grid" id="purposeGrid">
                <button type="button" class="chip-btn" data-val="산책">🐕 산책</button>
                <button type="button" class="chip-btn" data-val="러닝">🏃 러닝</button>
                <button type="button" class="chip-btn" data-val="출근/등교" style="grid-column: span 2;">🎒 출근 / 등교</button>
            </div>
            <div id="purposeError" class="error-msg">필수항목을 먼저 선택해 주세요.</div>
        </div>

        <button type="button" class="submit-btn" onclick="generateOutfit()">✨ AI 옷차림 추천받기</button>
    </div>

    <!-- 2. AI 코디 추천 결과 화면 -->
    <div id="resultScreen" class="screen card result-card hidden">
        <div class="weather-hero">
            <div id="resEmoji" class="weather-emoji">☀️</div>
            <div id="resLocation" class="hero-location">서울</div>
            <div id="resTemp" class="hero-temp">24°C</div>
        </div>

        <div class="outfit-image-container">
            <img id="outfitImg" src="" alt="AI 추천 코디 이미지">
        </div>

        <div class="outfit-details">
            <div class="outfit-item">
                <span class="outfit-label">👕 상의</span>
                <span id="resTop" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">👖 하의</span>
                <span id="resBottom" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">🧥 겉옷</span>
                <span id="resOuter" class="outfit-value">--</span>
            </div>
            <div class="outfit-item">
                <span class="outfit-label">🎒 추천 물품</span>
                <span id="resItems" class="outfit-value">--</span>
            </div>
        </div>

        <button type="button" class="btn-action btn-primary-reset" onclick="generateOutfit()">🔄 다시 코디하기 (다른 스타일)</button>
        <button type="button" class="btn-action btn-secondary-reset" onclick="goBack()">⚙️ 설정 다시 하기</button>

        <!-- Firebase 의견 작성 게시판 -->
        <div class="board-section">
            <div class="board-title">💬 코디 의견 나누기</div>
            <div class="board-form">
                <input type="text" id="feedbackName" class="board-input" placeholder="닉네임 (예: 홍길동)">
                <textarea id="feedbackText" class="board-textarea" placeholder="추천된 코디에 대한 의견을 남겨주세요!"></textarea>
                <button type="button" class="board-btn" id="btnSubmitFeedback">의견 등록하기</button>
            </div>
            <div id="boardList" class="board-list">
                <!-- 게시판 목록이 여기에 동적으로 추가됨 -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK 모듈 및 로직 처리 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmFU8CKJeETbWujvzdRM_rfJb1A3YN68Y",
            authDomain: "weather-outfit-85776.firebaseapp.com",
            projectId: "weather-outfit-85776",
            storageBucket: "weather-outfit-85776.firebasestorage.app",
            messagingSenderId: "281248174942",
            appId: "1:281248174942:web:e1c5b57d441473a7e335cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 게시판 실시간 불러오기
        const q = query(collection(db, "feedbacks"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const boardList = document.getElementById('boardList');
            boardList.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const item = document.createElement('div');
                item.className = 'board-item';
                const dateStr = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString('ko-KR') : '방금 전';
                item.innerHTML = `
                    <div class="board-item-header">
                        <span class="board-item-name">${data.name || '익명'}</span>
                        <span>${dateStr}</span>
                    </div>
                    <div class="board-item-content">${data.text}</div>
                `;
                boardList.appendChild(item);
            });
        });

        // 의견 등록 버튼 클릭
        document.getElementById('btnSubmitFeedback').addEventListener('click', async () => {
            const nameInput = document.getElementById('feedbackName');
            const textInput = document.getElementById('feedbackText');

            if (!textInput.value.trim()) {
                alert('의견 내용을 입력해주세요.');
                return;
            }

            try {
                await addDoc(collection(db, "feedbacks"), {
                    name: nameInput.value.trim() || '익명',
                    text: textInput.value.trim(),
                    createdAt: serverTimestamp()
                });
                textInput.value = '';
            } catch (e) {
                console.error("의견 등록 실패: ", e);
                alert("의견 등록 중 오류가 발생했습니다.");
            }
        });
    </script>

    <script>
        let selectedLocation = "";
        let selectedWeathers = [];
        let selectedPurpose = "";

        // 1. 고정밀 위치 파악 및 Reverse Geocoding 오류 수정
        function getLocation() {
            const resultDiv = document.getElementById('locationResult');
            resultDiv.innerText = "📍 현재 위치 탐색 중...";

            if (navigator.geolocation) {
                // enableHighAccuracy: true로 설정하여 정확도 향상
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        
                        try {
                            // OpenStreetMap Nominatim을 사용하여 좌표를 행정구역명으로 오차 없이 변환
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                            const data = await response.json();
                            
                            let city = data.address.city || data.address.county || data.address.province || data.address.state || "현재 위치";
                            let district = data.address.borough || data.address.suburb || data.address.quarter || "";
                            
                            selectedLocation = `${city} ${district}`.trim();
                            resultDiv.innerText = "✅ " + selectedLocation;
                            document.getElementById('locationSelect').value = "";
                            hideError('locationError');
                        } catch (err) {
                            selectedLocation = "현재 위치 근처";
                            resultDiv.innerText = "✅ " + selectedLocation;
                            hideError('locationError');
                        }
                    },
                    (err) => {
                        resultDiv.innerText = "";
                        alert("위치 접근 허용이 필요하거나 오차가 발생했습니다. 드롭다운 목록에서 위치를 직접 선택해 주세요.");
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            }
        }

        function onSelectLocation() {
            const val = document.getElementById('locationSelect').value;
            if(val) {
                selectedLocation = val;
                document.getElementById('locationResult').innerText = "✅ " + selectedLocation;
                hideError('locationError');
            }
        }

        // 2. 버튼 선택 이벤트
        document.querySelectorAll('#weatherGrid .chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!selectedLocation) {
                    showError('locationError');
                    return;
                }
                
                btn.classList.toggle('selected');
                const val = btn.getAttribute('data-val');
                
                if (btn.classList.contains('selected')) {
                    selectedWeathers.push(val);
                } else {
                    selectedWeathers = selectedWeathers.filter(item => item !== val);
                }

                if (selectedWeathers.length > 0) {
                    hideError('weatherError');
                }
            });
        });

        document.querySelectorAll('#purposeGrid .chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!selectedLocation) {
                    showError('locationError');
                    return;
                }
                if (selectedWeathers.length === 0) {
                    showError('weatherError');
                    return;
                }

                document.querySelectorAll('#purposeGrid .chip-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedPurpose = btn.getAttribute('data-val');
                hideError('purposeError');
            });
        });

        function showError(id) { document.getElementById(id).style.display = 'block'; }
        function hideError(id) { document.getElementById(id).style.display = 'none'; }

        // 3. 결과 화면 생성
        function generateOutfit() {
            if (!selectedLocation) { showError('locationError'); return; }
            if (selectedWeathers.length === 0) { showError('weatherError'); return; }
            if (!selectedPurpose) { showError('purposeError'); return; }

            const isRainy = selectedWeathers.includes('비');
            const isCloudy = selectedWeathers.includes('흐림');
            const isSnow = selectedWeathers.includes('눈');
            const isHot = selectedWeathers.includes('무더워/땡볕');
            const isCold = selectedWeathers.includes('쌀쌀함/선선');

            document.body.className = "";
            let bgTheme = "theme-bright"; 
            let emoji = "☀️";
            let defaultTemp = "25°C";

            if (isRainy) { bgTheme = "theme-rainy"; emoji = "🌧️"; defaultTemp = "18°C"; }
            else if (isCloudy) { bgTheme = "theme-cloudy"; emoji = "☁️"; defaultTemp = "20°C"; }
            else if (isSnow) { bgTheme = "theme-cloudy"; emoji = "❄️"; defaultTemp = "-1°C"; }
            else if (isHot) { bgTheme = "theme-bright"; emoji = "☀️"; defaultTemp = "30°C"; }
            else if (isCold) { bgTheme = "theme-bright"; emoji = "🍂"; defaultTemp = "15°C"; }

            document.body.classList.add(bgTheme);

            document.getElementById('resEmoji').innerText = emoji;
            document.getElementById('resLocation').innerText = selectedLocation;
            document.getElementById('resTemp').innerText = defaultTemp;

            const randomSeed = Math.floor(Math.random() * 10000);
            document.getElementById('outfitImg').src = `https://picsum.photos/600/800?random=${randomSeed}`;

            const outfitsData = {
                top: ["오버핏 린넨 반팔 셔츠", "캐주얼 단가라 피케 셔츠", "기능성 크루넥 티셔츠", "소프트 오버사이즈 니트", "베이직 맨투맨"],
                bottom: ["와이드 데님 팬츠", "쿨링 버뮤다 쇼츠", "테이퍼드 슬랙스", "스트릿 조거 팬츠", "코튼 카고 팬츠"],
                outer: ["경량 윈드브레이커", "오버핏 베이지 카디건", "클래식 데님 자켓", "지퍼 홑겹 점퍼", "선택 안함 (단품 추천)"],
                items: ["양산 & UV 차단 선글라스", "접이식 휴대용 우산", "기능성 슬링백 & 텀블러", "볼캡 모자", "미니 크로스백"]
            };

            const getRandomItem = (array) => array[Math.floor(Math.random() * array.length)];

            document.getElementById('resTop').innerText = getRandomItem(outfitsData.top);
            document.getElementById('resBottom').innerText = getRandomItem(outfitsData.bottom);
            document.getElementById('resOuter').innerText = isHot ? "선택 안함 (단품 추천)" : getRandomItem(outfitsData.outer);
            document.getElementById('resItems').innerText = isRainy ? "보호용 장우산 & 방수 백 Cover" : getRandomItem(outfitsData.items);

            document.getElementById('inputScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('inputScreen').classList.remove('hidden');
            document.body.className = "input-theme";
        }
    </script>
</body>
