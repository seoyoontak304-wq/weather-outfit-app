<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 날씨 맞춤 코디 추천</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* 1단계: 파스텔톤 노란색 & 하늘색 그라데이션 */
            background: linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%);
            transition: background 0.6s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .hidden {
            display: none !important;
        }

        /* 경고 메시지 스타일 */
        .alert-message {
            color: #e63946;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 6px;
            display: none;
        }

        /* --- 1. 입력 카드 스타일 --- */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2b2d42;
            margin-bottom: 20px;
            text-align: center;
        }

        .section-box {
            margin-bottom: 22px;
        }

        .section-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 위치 선택 영역 */
        .location-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn-location {
            flex: 1;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-location:hover {
            background-color: #357abd;
        }

        .select-city {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            background-color: #fff;
            outline: none;
        }

        .location-status {
            font-size: 0.85rem;
            color: #2b9348;
            font-weight: 600;
            margin-top: 6px;
        }

        /* 날씨 & 체감 상태 칩 그리드 */
        .chip-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .chip-btn {
            padding: 10px 12px;
            background: #f1f3f5;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            font-size: 0.88rem;
            color: #495057;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .chip-btn.selected {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
            font-weight: 600;
        }

        /* 야외 활동 목적 3개 버튼 */
        .purpose-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* 메인 제출 버튼 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
            margin-top: 10px;
            transition: transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* --- 2. AI 추천 결과 화면 스타일 (다크/글래스) --- */
        .result-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 28px 22px;
            color: #ffffff;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .weather-hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-emoji {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .hero-location-name {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2px;
        }

        .hero-temp-val {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* 추천 코디 이미지 카드 */
        .outfit-img-box {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .outfit-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 추천 상세 내역 */
        .outfit-details {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
        }

        .detail-val {
            font-weight: 600;
            color: #ffffff;
            text-align: right;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            border-radius: 14px;
            margin-top: 20px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 입력 화면 -->
        <div id="inputCard" class="card">
            <h1 class="card-title">오늘 뭐 입지? 🌤️</h1>

            <!-- 1. 위치 선택 -->
            <div class="section-box">
                <div class="section-label">1. 현재 위치 선택 (필수)</div>
                <div class="location-btns">
                    <button type="button" class="btn-location" onclick="getGPSLocation()">📍 내 위치 가져오기</button>
                </div>
                <select id="citySelect" class="select-city" onchange="onCitySelectChange()">
                    <option value="">-- 시/도 직접 선택 --</option>
                    <option value="서울특별시">서울특별시</option>
                    <option value="경기도">경기도</option>
                    <option value="인천광역시">인천광역시</option>
                    <option value="부산광역시">부산광역시</option>
                    <option value="대구광역시">대구광역시</option>
                    <option value="광주광역시">광주광역시</option>
                    <option value="대전광역시">대전광역시</option>
                    <option value="울산광역시">울산광역시</option>
                    <option value="강원도">강원도</option>
                    <option value="제주특별자치도">제주특별자치도</option>
                </select>
                <div id="locationSuccess" class="location-status"></div>
                <div id="alertLocation" class="alert-message">필수항목을 먼저 선택해 주세요.</div>
            </div>

            <!-- 2. 날씨 & 체감 상태 (중복 가능, 8개) -->
            <div class="section-box" onclick="checkLocationFirst()">
                <div class="section-label">2. 날씨 & 체감 상태 (필수/중복가능)</div>
                <div class="chip-grid">
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">🌧️ 비</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">❄️ 눈</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">☀️ 맑음</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">☁️ 흐림</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">💧 습함/꿉꿉함</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">🍃 바람 불어 시원</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">🍂 쌀쌀함/선선</button>
                    <button type="button" class="chip-btn weather-chip" onclick="toggleChip(this)">🔥 무더워/땡볕</button>
                </div>
                <div id="alertWeather" class="alert-message">필수항목을 먼저 선택해 주세요.</div>
            </div>

            <!-- 3. 야외 활동 목적 (3개 중 단일 선택) -->
            <div class="section-box" onclick="checkWeatherFirst()">
                <div class="section-label">3. 야외 활동 목적 (필수)</div>
                <div class="purpose-grid">
                    <button type="button" class="chip-btn purpose-chip" onclick="selectPurpose(this)">🚶‍♂️ 산책</button>
                    <button type="button" class="chip-btn purpose-chip" onclick="selectPurpose(this)">🏃‍♂️ 러닝</button>
                    <button type="button" class="chip-btn purpose-chip" onclick="selectPurpose(this)">💼 출근/등교</button>
                </div>
                <div id="alertPurpose" class="alert-message">필수항목을 먼저 선택해 주세요.</div>
            </div>

            <button type="button" class="submit-btn" onclick="generateRecommendation()">✨ AI 옷차림 추천받기</button>
        </div>

        <!-- 2. AI 추천 결과 화면 -->
        <div id="resultCard" class="result-card hidden">
            <!-- 상단 날씨 정보 -->
            <div class="weather-hero">
                <div id="resEmoji" class="weather-emoji">☀️</div>
                <div id="resLocation" class="hero-location-name">서울특별시</div>
                <div id="resTemp" class="hero-temp-val">24°C</div>
            </div>

            <!-- 코디 추천 대표 사진 -->
            <div class="outfit-img-box">
                <img id="resOutfitImg" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80" alt="추천 코디">
            </div>

            <!-- 세부 정보 -->
            <div class="outfit-details">
                <div class="detail-row">
                    <span class="detail-label">👕 상의</span>
                    <span id="resTop" class="detail-val">오버핏 반팔 티셔츠</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">👖 하의</span>
                    <span id="resBottom" class="detail-val">وا이드 와이드 슬랙스</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🧥 겉옷</span>
                    <span id="resOuter" class="detail-val">휴대용 얇은 셔츠</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🎒 추천 물품</span>
                    <span id="resItems" class="detail-val">양산, 자외선 차단제</span>
                </div>
            </div>

            <button type="button" class="reset-btn" onclick="resetPage()">다시 설정하기</button>
        </div>
    </div>

    <script>
        let selectedLocation = "";
        let selectedWeathers = [];
        let selectedPurpose = "";

        // 1. GPS 위치 가져오기
        function getGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // 위치 가져오기 성공 시 샘플 지역명 입력
                        selectedLocation = "경기도 수원시 (현재 위치)";
                        document.getElementById('locationSuccess').innerText = "✓ " + selectedLocation;
                        document.getElementById('citySelect').value = "";
                        document.getElementById('alertLocation').style.display = "none";
                    },
                    (error) => {
                        alert("위치 정보를 가져올 수 없어 기본 위치(서울특별시)로 설정합니다.");
                        selectedLocation = "서울특별시";
                        document.getElementById('locationSuccess').innerText = "✓ " + selectedLocation;
                        document.getElementById('alertLocation').style.display = "none";
                    }
                );
            } else {
                alert("이 브라우저에서는 Geolocation을 지원하지 않습니다.");
            }
        }

        // 시/도 직접 선택 시
        function onCitySelectChange() {
            const val = document.getElementById('citySelect').value;
            if(val) {
                selectedLocation = val;
                document.getElementById('locationSuccess').innerText = "✓ " + selectedLocation;
                document.getElementById('alertLocation').style.display = "none";
            } else {
                selectedLocation = "";
                document.getElementById('locationSuccess').innerText = "";
            }
        }

        // 순서 검증 함수들
        function checkLocationFirst() {
            if (!selectedLocation) {
                document.getElementById('alertLocation').style.display = "block";
            }
        }

        function checkWeatherFirst() {
            checkLocationFirst();
            if (selectedLocation && selectedWeathers.length === 0) {
                document.getElementById('alertWeather').style.display = "block";
            }
        }

        // 2. 날씨 토글 (다중 선택)
        function toggleChip(btn) {
            if (!selectedLocation) {
                document.getElementById('alertLocation').style.display = "block";
                return;
            }
            btn.classList.toggle('selected');
            
            const text = btn.innerText;
            if (btn.classList.contains('selected')) {
                selectedWeathers.push(text);
            } else {
                selectedWeathers = selectedWeathers.filter(item => item !== text);
            }

            if(selectedWeathers.length > 0) {
                document.getElementById('alertWeather').style.display = "none";
            }
        }

        // 3. 활동 목적 선택 (단일 선택)
        function selectPurpose(btn) {
            if (!selectedLocation) {
                document.getElementById('alertLocation').style.display = "block";
                return;
            }
            if (selectedWeathers.length === 0) {
                document.getElementById('alertWeather').style.display = "block";
                return;
            }

            document.querySelectorAll('.purpose-chip').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedPurpose = btn.innerText;
            document.getElementById('alertPurpose').style.display = "none";
        }

        // 4. 추천 화면 전환 및 데이터 구성
        function generateRecommendation() {
            if (!selectedLocation) {
                document.getElementById('alertLocation').style.display = "block";
                return;
            }
            if (selectedWeathers.length === 0) {
                document.getElementById('alertWeather').style.display = "block";
                return;
            }
            if (!selectedPurpose) {
                document.getElementById('alertPurpose').style.display = "block";
                return;
            }

            // 조건에 맞춰 UI 다이내믹 변경
            const primaryWeather = selectedWeathers[0];
            let bgGradient = "linear-gradient(135deg, #0f172a 0%, #1e293b 100%)";
            let emoji = "☀️";
            let tempVal = "25°C";
            let topText = "반팔 린넨 셔츠";
            let bottomText = "슬랙스";
            let outerText = "없음";
            let itemsText = "양산 / 선글라스";
            let imgUrl = "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80";

            if (primaryWeather.includes("비")) {
                bgGradient = "linear-gradient(135deg, #2c3e50 0%, #000000 100%)";
                emoji = "🌧️";
                tempVal = "19°C";
                outerText = "방수 바람막이";
                itemsText = "우산, 래쉬가드 신발";
                imgUrl = "https://images.unsplash.com/photo-1534260147234-09a21540574e?auto=format&fit=crop&w=800&q=80";
            } else if (primaryWeather.includes("눈") || primaryWeather.includes("쌀쌀함")) {
                bgGradient = "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)";
                emoji = "❄️";
                tempVal = "8°C";
                topText = "니트 / 맨투맨";
                outerText = "경량 패딩 또는 자켓";
                itemsText = "머플러";
                imgUrl = "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80";
            } else if (primaryWeather.includes("무더워")) {
                bgGradient = "linear-gradient(135deg, #373b44 0%, #4286f4 100%)";
                emoji = "🔥";
                tempVal = "31°C";
                topText = "기능성 반팔 티셔츠";
                bottomText = "반바지 / 린넨 팬츠";
                itemsText = "손선풍기, 이온음료";
            }

            // 결과 적용
            document.body.style.background = bgGradient;
            document.getElementById('resLocation').innerText = selectedLocation;
            document.getElementById('resEmoji').innerText = emoji;
            document.getElementById('resTemp').innerText = tempVal;
            document.getElementById('resTop').innerText = topText;
            document.getElementById('resBottom').innerText = bottomText;
            document.getElementById('resOuter').innerText = outerText;
            document.getElementById('resItems').innerText = itemsText;
            document.getElementById('resOutfitImg').src = imgUrl;

            // 화면 전환
            document.getElementById('inputCard').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
        }

        function resetPage() {
            // 초기화 후 메인 화면 복구
            document.body.style.background = "linear-gradient(135deg, #fff3b0 0%, #cae9ff 100%)";
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('inputCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
