<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야외활동 쾌적 케어 AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 🔑 [카카오맵 API] YOUR_KAKAO_JS_KEY 부분을 발급받으신 JavaScript 키로 교체하세요! -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JS_KEY&libraries=services"></script>

  <style>
    .selected-btn {
      border-color: #3b82f6 !important;
      background-color: #eff6ff !important;
      color: #1d4ed8 !important;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>☀️</span> OutdoorCare AI
      </h1>
      <span class="text-xs bg-blue-500 px-2 py-1 rounded-full">실시간 쾌적 가이드</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- 1. 날씨 및 활동 목적 선택 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
          <span>🌡️</span> 1. 현재 날씨 & 느낌 선택
        </h2>
        <button onclick="resetSelections()" class="text-xs text-slate-400 hover:text-red-500 flex items-center gap-1 transition">
          <span>🔄</span> 선택 초기화
        </button>
      </div>
      
      <p class="text-xs text-slate-500 mb-2">체감 날씨를 선택해주세요 (복수 선택 가능 / 다시 누르면 취소):</p>
      <div class="grid grid-cols-2 gap-2 mb-4" id="weather-options">
        <button onclick="toggleWeather('☀️ 무더움/햇빛강함', this)" class="opt-btn weather-btn p-2.5 text-sm border rounded-xl border-slate-200 hover:border-blue-400 transition">☀️ 무더움 / 땡볕</button>
        <button onclick="toggleWeather('💧 습하고 꿉꿉함', this)" class="opt-btn weather-btn p-2.5 text-sm border rounded-xl border-slate-200 hover:border-blue-400 transition">💧 습함 / 꿉꿉함</button>
        <button onclick="toggleWeather('🍃 바람 불어 시원함', this)" class="opt-btn weather-btn p-2.5 text-sm border rounded-xl border-slate-200 hover:border-blue-400 transition">🍃 바람 불어 시원</button>
        <button onclick="toggleWeather('❄️ 쌀쌀함/선선함', this)" class="opt-btn weather-btn p-2.5 text-sm border rounded-xl border-slate-200 hover:border-blue-400 transition">❄️ 쌀쌀함 / 선선</button>
      </div>

      <p class="text-xs text-slate-500 mb-2">야외활동 목적을 선택해주세요 (다시 누르면 취소):</p>
      <div class="grid grid-cols-2 gap-2" id="activity-options">
        <button onclick="toggleActivity('🚶‍♂️ 산책', this)" class="opt-btn activity-btn p-2.5 text-xs border rounded-xl border-slate-200 hover:border-blue-400 transition">🚶‍♂️ 산책</button>
        <button onclick="toggleActivity('🏃‍♀️ 러닝', this)" class="opt-btn activity-btn p-2.5 text-xs border rounded-xl border-slate-200 hover:border-blue-400 transition">🏃‍♀️ 러닝</button>
        <button onclick="toggleActivity('🚌 출근/등교', this)" class="opt-btn activity-btn p-2.5 text-xs border rounded-xl border-slate-200 hover:border-blue-400 transition">🚌 출근 / 등교</button>
        <button onclick="toggleActivity('☕ 데이트', this)" class="opt-btn activity-btn p-2.5 text-xs border rounded-xl border-slate-200 hover:border-blue-400 transition">☕ 데이트</button>
      </div>
    </section>

    <!-- 2. AI 추천받기 및 결과 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-base font-bold text-slate-900 mb-3 flex items-center gap-1.5">
        <span>👕</span> 2. AI 맞춤 코디 & 준비물
      </h2>

      <button id="recommend-btn" onclick="getAICoord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex justify-center items-center gap-2">
        <span>✨</span> AI 옷차림 추천받기
      </button>

      <div id="loading" class="hidden my-6 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
        <p class="text-xs text-slate-500 mt-2">AI가 최적의 코디를 조합하는 중...</p>
      </div>

      <!-- AI 추천 결과 영역 -->
      <div id="ai-result" class="hidden mt-4 p-4 bg-blue-50/50 border border-blue-100 rounded-xl space-y-3">
        <p id="res-summary" class="text-xs font-semibold text-blue-800 bg-blue-100 p-2 rounded-lg"></p>
        
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-white p-2.5 rounded-lg border border-slate-100">
            <span class="text-slate-400 block mb-0.5">👔 상의</span>
            <span id="res-top" class="font-bold text-slate-700"></span>
          </div>
          <div class="bg-white p-2.5 rounded-lg border border-slate-100">
            <span class="text-slate-400 block mb-0.5">👖 하의</span>
            <span id="res-bottom" class="font-bold text-slate-700"></span>
          </div>
          <div class="bg-white p-2.5 rounded-lg border border-slate-100">
            <span class="text-slate-400 block mb-0.5">👟 신발</span>
            <span id="res-shoes" class="font-bold text-slate-700"></span>
          </div>
          <div class="bg-white p-2.5 rounded-lg border border-slate-100">
            <span class="text-slate-400 block mb-0.5">🎒 필수 준비물</span>
            <span id="res-supplies" class="font-bold text-blue-600"></span>
          </div>
        </div>

        <div class="bg-white p-3 rounded-lg border border-slate-100 text-xs">
          <span class="font-bold text-amber-600 block mb-1">💡 쾌적 Tip</span>
          <p id="res-tip" class="text-slate-600 leading-relaxed"></p>
        </div>

        <button id="copy-btn" onclick="copyResultToClipboard()" class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium py-2.5 px-3 rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm active:scale-95">
          <span>📋</span> 추천 결과 텍스트 복사하기
        </button>
      </div>
    </section>

    <!-- 3. 주변 무더위 쉼터 지도 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
          <span>🏞️</span> 3. 내 주변 무더위 쉼터
        </h2>
        <button onclick="loadShelterMap()" class="text-xs text-blue-600 underline">내 위치 갱신</button>
      </div>

      <p class="text-xs text-slate-500 mb-3">현재 위치 주변의 공공 쉼터 및 휴게공간입니다.</p>
      
      <div id="map" class="w-full h-64 bg-slate-100 rounded-xl overflow-hidden flex items-center justify-center text-xs text-slate-400 border border-slate-200">
        지도를 불러오는 중입니다...
      </div>
    </section>

  </main>

  <script>
    // 날씨는 복수 선택이 가능하도록 배열로 관리
    let selectedWeathers = [];
    let selectedActivity = null;
    let userLocation = 'GPS 수집 중...';

    // 날씨 토글 (복수 선택)
    function toggleWeather(value, btn) {
      if (btn.classList.contains('selected-btn')) {
        btn.classList.remove('selected-btn');
        selectedWeathers = selectedWeathers.filter(item => item !== value);
      } else {
        btn.classList.add('selected-btn');
        selectedWeathers.push(value);
      }
    }

    // 야외활동 토글 (단일 선택)
    function toggleActivity(value, btn) {
      const buttons = document.querySelectorAll('.activity-btn');
      
      if (btn.classList.contains('selected-btn')) {
        btn.classList.remove('selected-btn');
        selectedActivity = null;
      } else {
        buttons.forEach(b => b.classList.remove('selected-btn'));
        btn.classList.add('selected-btn');
        selectedActivity = value;
      }
    }

    // 선택 초기화
    function resetSelections() {
      document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected-btn'));
      selectedWeathers = [];
      selectedActivity = null;
      document.getElementById('ai-result').classList.add('hidden');
    }

    document.addEventListener("DOMContentLoaded", () => {
      initLocation();
    });

    function initLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            userLocation = `위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)}`;
            renderMap(lat, lng);
          },
          () => {
            userLocation = '서울시 관악구 (기본 위치)';
            renderMap(37.4782, 126.9515);
          }
        );
      } else {
        renderMap(37.4782, 126.9515);
      }
    }

    async function getAICoord() {
      if (selectedWeathers.length === 0 || !selectedActivity) {
        alert('날씨 상태(최소 1개)와 야외활동 목적을 모두 선택해 주세요!');
        return;
      }

      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('ai-result');
      const btn = document.getElementById('recommend-btn');

      loading.classList.remove('hidden');
      resultBox.classList.add('hidden');
      btn.disabled = true;

      const weatherCombined = selectedWeathers.join(', ');

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            weatherState: weatherCombined,
            activityType: selectedActivity,
            userFeeling: weatherCombined,
            location: userLocation
          })
        });

        const data = await response.json();

        if (data.error) throw new Error(data.error);

        document.getElementById('res-summary').innerText = data.summary;
        document.getElementById('res-top').innerText = data.top;
        document.getElementById('res-bottom').innerText = data.bottom;
        document.getElementById('res-shoes').innerText = data.shoes;
        document.getElementById('res-supplies').innerText = Array.isArray(data.supplies) ? data.supplies.join(', ') : data.supplies;
        document.getElementById('res-tip').innerText = data.tip;

        resultBox.classList.remove('hidden');
      } catch (err) {
        alert('추천을 불러오지 못했습니다: ' + err.message);
      } finally {
        loading.classList.add('hidden');
        btn.disabled = false;
      }
    }

    async function copyResultToClipboard() {
      const summary = document.getElementById('res-summary').innerText;
      const top = document.getElementById('res-top').innerText;
      const bottom = document.getElementById('res-bottom').innerText;
      const shoes = document.getElementById('res-shoes').innerText;
      const supplies = document.getElementById('res-supplies').innerText;
      const tip = document.getElementById('res-tip').innerText;

      const textToCopy = `[☀️ OutdoorCare AI - 오늘 야외활동 코디 추천]

💡 한줄 요약: ${summary}

👔 상의: ${top}
👖 하의: ${bottom}
👟 신발: ${shoes}
🎒 준비물: ${supplies}

📌 쾌적 Tip: ${tip}

내 위치 기반 맞춤 추천받기: ${window.location.href}`;

      try {
        await navigator.clipboard.writeText(textToCopy);
        const copyBtn = document.getElementById('copy-btn');
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span>✅</span> 클립보드에 복사되었습니다!';
        copyBtn.classList.replace('bg-slate-800', 'bg-emerald-600');

        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.classList.replace('bg-emerald-600', 'bg-slate-800');
        }, 2000);
      } catch (err) {
        alert('복사에 실패했습니다.');
      }
    }

    function renderMap(lat, lng) {
      const mapContainer = document.getElementById('map');
      
      if (typeof kakao === 'undefined' || !kakao.maps) {
        mapContainer.innerHTML = `<div class="p-4 text-center">📍 <strong>현재 위치:</strong><br>${userLocation}<br><br>(카카오맵 API 키 연동 시 실제 지도가 출력됩니다)</div>`;
        return;
      }

      const mapOption = {
        center: new kakao.maps.LatLng(lat, lng),
        level: 4
      };
      const map = new kakao.maps.Map(mapContainer, mapOption);

      const myMarker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(lat, lng),
        map: map
      });

      const shelterPositions = [
        { title: '중앙 공원 무더위 쉼터', lat: lat + 0.002, lng: lng + 0.001 },
        { title: '구민회관 무더위 쉼터', lat: lat - 0.0015, lng: lng + 0.002 },
        { title: '느티나무 공원 쉼터', lat: lat + 0.001, lng: lng - 0.002 }
      ];

      shelterPositions.forEach(pos => {
        new kakao.maps.Marker({
          map: map,
          position: new kakao.maps.LatLng(pos.lat, pos.lng),
          title: pos.title
        });
      });
    }

    function loadShelterMap() {
      initLocation();
    }
  </script>
</body>
</html>
